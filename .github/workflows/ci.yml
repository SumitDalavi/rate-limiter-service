name: CI Pipeline
'on':
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
jobs:
  go-build-test:
    name: Go Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.21.x
      - name: Download Dependencies
        run: go mod download
      - name: Run Linter
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
      - name: Build
        run: go build -v ./...
      - name: Test
        run: go test -v ./...
  docker-build:
    name: Docker Build Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker Image
        run: docker build -t test-image .
  benchmark:
    name: Run Benchmark
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.21.x
      - name: Run Benchmarks
        run: bash benchmarks/run.sh
      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: rate-limiter-benchmark-results
          path: benchmarks/results/
          retention-days: 90
